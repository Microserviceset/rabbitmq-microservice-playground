name: auth-service

on:
  pull_request:
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-service.yml'
  push:
    branches: [main]
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-service.yml'

jobs:
  build:
    name: auth-service-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t auth-service:${{ github.sha }} ./auth-service
